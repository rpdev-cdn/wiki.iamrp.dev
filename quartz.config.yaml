# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: RPDev Wiki
  pageTitleSuffix: " | RPDev Wiki"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: wiki.iamrp.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local # Enforces air-gapped typography (cdn.iamrp.dev)
    cdnCaching: false
    typography:
      header: "JetBrains Mono"
      body: "JetBrains Mono"
      code: "JetBrains Mono"
    colors:
      lightMode: # Repurposed as "ANSI Dark Mode"
        light: "#000000" # Pure black background
        lightgray: "#1c1c1c" # Subtle borders
        gray: "#767676" # Muted metadata
        darkgray: "#cccccc" # Primary body text
        dark: "#ffffff" # Bright headings
        secondary: "#00afaf" # ANSI Cyan for links
        tertiary: "#5fafd7" # ANSI Light Cyan for hover
        highlight: rgba(0, 175, 175, 0.15)
        textHighlight: rgba(0, 175, 175, 0.25)
      darkMode: # Custom Sovereign Space Purple-Black & Cyan
        light: "#0d0914" # Deep space purple-black background
        lightgray: "#1e1b2e" # Elevated UI panels/search bar
        gray: "#8b889c" # Muted text with a purple tint
        darkgray: "#e2e1e8" # Standard body text
        dark: "#ffffff" # Headings
        secondary: "#00afaf" # ANSI Cyan for primary links & Graph nodes
        tertiary: "#5fafd7" # ANSI Light Cyan for hover states & interaction
        highlight: rgba(0, 175, 175, 0.15) # Faint cyan link background
        textHighlight: rgba(0, 175, 175, 0.25) # Cyan markdown highlight (==text==)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/RPDevs-Builds
        Launcher: https://launcher.iamrp.dev
        Feed: https://feed.launcher.iamrp.dev
        Repository: https://repo.iamrp.dev
        CDN: https://cdn.iamrp.dev
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
